              - text: 从 V1.8.2 版本升级到 V2.0.0 版本，不影响您继续使用 V1.8.2 版本的接口。详细的接口变更和升级说明请参见
              - link "升级指南（V2）" [ref=f13e573] [cursor=pointer]:
                - /url: https://doc.yunxin.163.com/nertccallkit/guide/jAxNTE0MDc?platform=iOS
              - text: 。
