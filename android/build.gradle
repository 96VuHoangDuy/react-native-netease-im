apply plugin: 'com.android.library'

def DEFAULT_COMPILE_SDK_VERSION   = 27
def DEFAULT_BUILD_TOOLS_VERSION   = "27.0.3"
def DEFAULT_TARGET_SDK_VERSION    = 27
def DEFAULT_MIN_SDK_VERSION       = 16
def DEFAULT_SUPPOR_LIBVERSION = "27.0.3"

android {
    namespace 'com.netease.im'
//    useLibrary 'org.apache.http.legacy'

    compileSdkVersion rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : DEFAULT_COMPILE_SDK_VERSION


    defaultConfig {
        minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : DEFAULT_MIN_SDK_VERSION
        targetSdkVersion rootProject.hasProperty('targetSdkVersion') ? rootProject.targetSdkVersion : DEFAULT_TARGET_SDK_VERSION
        versionCode 1
        versionName "1.0"
        ndk {
            //设置支持的SO库架构
            abiFilters "armeabi-v7a", "x86","arm64-v8a","x86_64"
        }
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    sourceSets{
        main{
            // jniLibs.srcDir(['libs'])
        }
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        aidl true
    }
}

repositories {
    mavenCentral()
    // flatDir {
    //     dirs 'libs'
    // }
}

dependencies {
    // implementation fileTree(include: '*.jar', dir: 'libs')
    implementation 'com.facebook.react:react-native:+'
    // 基础功能 (必需)
    def nim_version = "9.16.3"
    implementation "com.netease.nimlib:basesdk:${nim_version}"
    implementation "com.netease.nimlib:push:${nim_version}"
    implementation "com.netease.nimlib:lucene:${nim_version}"
    implementation "net.zetetic:android-database-sqlcipher:4.5.3"
    implementation "androidx.sqlite:sqlite:2.1.0"
    implementation 'com.alibaba:fastjson:1.2.57'
    
    // Push SDKs
    // implementation 'com.huawei.hms:push:6.12.0.300'
    // implementation 'com.hihonor.mcs:push:7.0.61.303'
    // implementation 'vivo:vpush:4.1.0.0'
    // compileOnly(name: 'MiPush_SDK_Client_6_0_1-C_3rd', ext: 'aar')
    // compileOnly(name: 'com.heytap.msp_V3.7.1', ext: 'aar')
    implementation project(':pushlib')

    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'

}
  