            - paragraph [ref=f13e583]:
              - strong [ref=f13e584]: 升级说明
            - paragraph [ref=f13e585]: V1.8.0 版本可直接升级至 V1.8.2 版本。
            - paragraph [ref=f13e586]:
              - strong [ref=f13e587]: 兼容版本
            - list [ref=f13e588]:
              - listitem [ref=f13e589]: 适配 NIM V9.8.0 版本。
              - listitem [ref=f13e590]: 适配 NERTC SDK V4.6.29 版本。
            - heading "1.8.0 (2022-11-01)" [level=2] [ref=f13e591]
            - paragraph [ref=f13e592]:
              - strong [ref=f13e593]: API 变更
            - list [ref=f13e594]:
              - listitem [ref=f13e595]:
                - code [ref=f13e596]: NERtcCallOptions
                - text: 接口中的是否同时初始化 RTC 的参数，从之前的
                - code [ref=f13e597]: shouldInitializeRtc
                - text: 参数，替换为新的
                - code [ref=f13e598]: globalInit
                - text: 参数。
                - generic [ref=f13e599]:
                  - generic [ref=f13e600]: objc
                  - code [ref=f13e601]: /// 是否在初始化的时候初始化Rtc，默认为YES，设置为NO，主叫在呼叫时初始化，被叫在有呼叫到达的时候初始化 @property(nonatomic, assign) BOOL globalInit;
              - listitem [ref=f13e602]:
                - code [ref=f13e603]: NERtcCallOptions
                - text: 接口中新增
                - code [ref=f13e604]: joinRtcWhenCall
                - text: 参数，设置主叫在呼叫时是否加入 RTC 房间。
                - generic [ref=f13e605]:
                  - generic [ref=f13e606]: objc
                  - code [ref=f13e607]: /// 主叫是否在呼叫时加入rtc，默认为NO，在被叫接听时加入RTC 房间，不提前加入。如设置提前加入房间会带来通话费用的增加，同时提升首帧开画时间 @property(nonatomic, assign) BOOL joinRtcWhenCall;
            - paragraph [ref=f13e608]:
              - strong [ref=f13e609]: 升级说明
            - paragraph [ref=f13e610]: 不可直接升级，从V1.6.5 版本升级至 V1.8.0 版本时，您需要在代码中对新增和变更的接口进行修改和适配，主要变更如下：
            - list [ref=f13e611]:
              - listitem [ref=f13e612]:
                - text: 呼叫组件内部不再引用 NERTC，需要单独引用 NERTC。示例代码如下：
                - code [ref=f13e614]: "#呼叫组件 pod 'NERtcCallKit','1.8.0' #NERtcSDK pod 'NERtcSDK', '4.6.22', :subspecs => ['RtcBasic']"
              - listitem [ref=f13e615]:
                - text: 业务应用不再需要通过
                - code [ref=f13e616]: NERtcCallKitTokenHandler
                - text: 回调获取 RTC Token，呼叫组件内部已实现相关获取流程。
              - listitem [ref=f13e617]:
                - code [ref=f13e618]: NERtcCallOptions
                - text: 接口中的是否同时初始化 RTC 的参数，删除了
                - code [ref=f13e619]: shouldInitializeRtc
                - text: 参数，替换为新的
                - code [ref=f13e620]: globalInit
                - text: 参数。
            - paragraph [ref=f13e621]:
              - strong [ref=f13e622]: 兼容版本
            - list [ref=f13e623]:
              - listitem [ref=f13e624]: 适配 NIM V9.6.4 版本。
              - listitem [ref=f13e625]: 适配 NERTC SDK V4.6.22 版本。
            - heading "1.6.1 (2022-08-26)" [level=2] [ref=f13e626]
            - paragraph [ref=f13e627]:
              - strong [ref=f13e628]: 新增特性
            - list [ref=f13e629]:
              - listitem [ref=f13e630]: 支持音视频通话切换确认。
              - listitem [ref=f13e631]:
                - code [ref=f13e632]: NERtcCallKitTokenHandler
                - text: 回调新增
                - code [ref=f13e633]: channelName
                - text: 参数。
            - paragraph [ref=f13e634]:
              - strong [ref=f13e635]: 新增 API
            - list [ref=f13e636]:
              - listitem [ref=f13e637]:
                - paragraph [ref=f13e638]: 新增音视频切换确认，默认不开启确认。
                - generic [ref=f13e639]:
                  - generic [ref=f13e640]: objc
                  - code [ref=f13e641]: /// 音视频切换是否需要确认配置 /// @param video 切换到视频是否需要确认 /// @param audio 切换到音频是否需要确认 - (void)enableSwitchCallTypeConfirmVideo:(BOOL)video audio:(BOOL)audio;
              - listitem [ref=f13e642]:
                - paragraph [ref=f13e643]: 新增音视频切换回调，新增回调中有音视频切换指令类型，如果未开启音视频切换确认配置，可忽略第二个字段。
                - generic [ref=f13e644]:
                  - generic [ref=f13e645]: objc
                  - code [ref=f13e646]: "/// 通话类型切换的回调（仅1对1呼叫有效） /// @param callType 切换后的类型 /// @param state 切换应答类型: 邀请/同意/拒绝 - (void)onCallTypeChange:(NERtcCallType)callType withState:(NERtcSwitchState)state;"
            - paragraph [ref=f13e647]: "** API 变更**"
            - list [ref=f13e648]:
              - listitem [ref=f13e649]:
                - text: 修改音视频切换接口参数，如果未开启音视频切换确认可以忽略第二个参数。
                - generic [ref=f13e650]:
                  - generic [ref=f13e651]: objc
                  - code [ref=f13e652]: "/// 在通话过程中切换通话类型。非通话过程中调用无效。仅支持1对1通话。 /// @param type 通话类型: 音频/视频 /// @param state 切换应答类型: 邀请/同意/拒绝 /// @param completion 回调 /// @discussion /// 切换完成后，组件内部会将己端和对端调用-enableLocalVideo:，此时外部不建议再调用 -enableLocalVideo:，防止状态错乱. - (void)switchCallType:(NERtcCallType)type withState:(NERtcSwitchState)state completion:(nullable void (^)(NSError *_Nullable error))completion;"
              - listitem [ref=f13e653]:
                - text: 获取 Token 的
                - code [ref=f13e654]: NERtcCallKitTokenHandler
                - text: 回调增加
                - code [ref=f13e655]: channelName
                - text: 参数。
                - generic [ref=f13e656]:
                  - generic [ref=f13e657]: objc
                  - code [ref=f13e658]: "// 定义示例 typedef void (^NERtcCallKitTokenHandler)(uint64_t uid, NSString *channelName, void (^complete)(NSString *token, NSError *error)); // 使用示例 callkit.tokenHandler = ^(uint64_t uid, NSString *channelName, void (^complete)(NSString *token, NSError *error)){ };"
            - paragraph [ref=f13e659]:
              - strong [ref=f13e660]: 问题修复
            - paragraph [ref=f13e661]: 修复当移动端作为被叫时，概率出现 Web 端用户无法看到移动端用户的摄像头画面的问题。
            - paragraph [ref=f13e662]:
              - strong [ref=f13e663]: 升级说明
            - paragraph [ref=f13e664]: 不可直接升级，从V1.5.7 版本升级至 V1.6.1 版本时，您需要在代码中对新增和变更的接口进行修改和适配，具体变更请参见如下新增 API 和 API 变更。
            - paragraph [ref=f13e665]:
              - strong [ref=f13e666]: 兼容版本
