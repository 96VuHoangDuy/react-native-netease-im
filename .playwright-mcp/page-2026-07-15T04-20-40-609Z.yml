            - heading "2.2.0 (2023-11-03)" [level=2] [ref=f13e503]
            - paragraph [ref=f13e504]:
              - strong [ref=f13e505]: 新增特性
            - list [ref=f13e506]:
              - listitem [ref=f13e507]:
                - paragraph [ref=f13e508]: UI 组件新增小窗功能，默认不开启，可在初始化时配置相应参数：
                - list [ref=f13e509]:
                  - listitem [ref=f13e510]:
                    - text: 新增应用内小窗功能（通过 Rtc Canvas View 实现），初始化时配置
                    - code [ref=f13e511]: enableFloatingWindow
                    - text: 参数。
                  - listitem [ref=f13e512]:
                    - text: 新增应用外小窗功能（通过系统画中画实现），初始化时配置
                    - code [ref=f13e513]: enableFloatingWindowOutOfApp
                    - text: 参数, 同时依赖
                    - code [ref=f13e514]: NETranscodingKit
                    - text: 转码扩展包，只需要在主工程总引入，内部会判断此插件扩展包是否集成。
              - listitem [ref=f13e515]:
                - paragraph [ref=f13e516]:
                  - text: UI 组件新增被呼叫预览功能，默认不开启，可在初始化时配置
                  - code [ref=f13e517]: enableCalleePreview
                  - text: 参数。
              - listitem [ref=f13e518]:
                - paragraph [ref=f13e519]: UI 组件支持铃声。只有带UI的呼叫组件支持自定义铃声。提前加入 RTC 的模式不支持铃声，请引入 UI 组件源码自行实现。
              - listitem [ref=f13e520]:
                - paragraph [ref=f13e521]:
                  - text: UI 组件新增虚化（通话中）功能，默认不开启，可在初始化时配置
                  - code [ref=f13e522]: enableVirtualBackground
                  - text: 参数。
            - paragraph [ref=f13e523]:
              - strong [ref=f13e524]: 改进优化
            - paragraph [ref=f13e525]:
              - text: 被呼叫后调用
              - code [ref=f13e526]: accept
              - text: 接口时，如果加入 RTC 失败，此场景下除了在
              - code [ref=f13e527]: accept
              - text: 接口返回对应的 error 信息，也同时触发
              - code [ref=f13e528]: onCallEnd
              - text: 回调。
            - paragraph [ref=f13e529]:
              - strong [ref=f13e530]: 兼容版本
            - list [ref=f13e531]:
              - listitem [ref=f13e532]: 适配 NIM SDK V9.12.0 版本。
